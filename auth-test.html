<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>예수마음 · 로그인 테스트</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#FAF6EE;color:#2B2A28;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}.wrap{max-width:430px;margin:auto;padding:42px 20px}.card{background:#fff;border:1px solid #E6DFD1;border-radius:18px;padding:24px;box-shadow:0 2px 8px #00000008}h1{font-family:Georgia,"Batang",serif;color:#7A2E2E;text-align:center;margin:0 0 8px}p{font-size:13px;line-height:1.6;color:#8C8577;text-align:center}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:20px 0 16px}.tabs button{border:0;border-radius:10px;padding:10px;background:#F3E4E1;color:#7A2E2E;font-weight:700;cursor:pointer}.tabs button.active{background:#7A2E2E;color:#fff}.field{margin:10px 0}.field label{display:block;font-size:12px;margin-bottom:5px;color:#6d675e}.field input{width:100%;padding:12px;border:1px solid #E6DFD1;border-radius:10px;background:#FAF6EE;font-size:14px}.primary{width:100%;border:0;border-radius:10px;padding:12px;background:#7A2E2E;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}.msg{margin-top:12px;padding:10px;border-radius:9px;background:#F6ECD8;font-size:12px;line-height:1.5;display:none}.back{display:block;text-align:center;margin-top:18px;color:#8C8577;font-size:12px}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>예수마음</h1><p>우리 교회 공동체를 위한 로그인 테스트</p>
<div class="tabs"><button id="loginTab" class="active" onclick="mode('login')">로그인</button><button id="signupTab" onclick="mode('signup')">회원가입</button></div>
<div id="churchField" class="field" style="display:none"><label>교회 가입 암호</label><input id="churchCode" type="password" autocomplete="off" placeholder="교회에서 알려준 암호"></div>
<div class="field"><label>이메일</label><input id="email" type="email" autocomplete="email" placeholder="example@email.com"></div>
<div class="field"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password" placeholder="6자 이상"></div>
<div id="nameField" class="field" style="display:none"><label>이름</label><input id="name" type="text" autocomplete="name" placeholder="교회에서 사용할 이름"></div>
<button id="submit" class="primary" onclick="submitAuth()">로그인</button><div id="msg" class="msg"></div>
<a class="back" href="index_v2.html">기존 앱으로 돌아가기</a>
</div></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import { getFirestore, doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';

const firebaseConfig={apiKey:'AIzaSyCDlqRtl4O2rVzFXhn5ozpe11e34eRtQKI',authDomain:'jesus-heart-2c2b7.firebaseapp.com',projectId:'jesus-heart-2c2b7',storageBucket:'jesus-heart-2c2b7.firebasestorage.app',messagingSenderId:'583535424892',appId:'1:583535424892:web:6ec39032a3f2fb5eba20f9'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let currentMode='login';
window.mode=(m)=>{currentMode=m;document.getElementById('loginTab').classList.toggle('active',m==='login');document.getElementById('signupTab').classList.toggle('active',m==='signup');document.getElementById('churchField').style.display=m==='signup'?'block':'none';document.getElementById('nameField').style.display=m==='signup'?'block':'none';document.getElementById('submit').textContent=m==='signup'?'회원가입':'로그인';hideMsg()};
function msg(t){const e=document.getElementById('msg');e.textContent=t;e.style.display='block'}function hideMsg(){document.getElementById('msg').style.display='none'}
window.submitAuth=async()=>{hideMsg();const email=document.getElementById('email').value.trim(),pw=document.getElementById('password').value,name=document.getElementById('name').value.trim(),code=document.getElementById('churchCode').value.trim();try{if(currentMode==='signup'){if(code!=='은혜2026')throw new Error('교회 가입 암호가 맞지 않습니다.');if(!name)throw new Error('이름을 입력해 주세요.');const c=await createUserWithEmailAndPassword(auth,email,pw);await setDoc(doc(db,'appdata','member:'+c.user.uid),{uid:c.user.uid,email:c.user.email,name,createdAt:serverTimestamp()},{merge:true});msg('회원가입이 완료되었습니다. 이제 공동체 앱에 연결할 수 있습니다.')}else{await signInWithEmailAndPassword(auth,email,pw);msg('로그인되었습니다.')} }catch(e){msg(e.code==='auth/email-already-in-use'?'이미 가입된 이메일입니다.':e.code==='auth/invalid-credential'?'이메일 또는 비밀번호가 맞지 않습니다.':e.code==='auth/weak-password'?'비밀번호는 6자 이상이어야 합니다.':e.message||'처리 중 오류가 발생했습니다.')}};
onAuthStateChanged(auth,u=>{if(u) console.log('Firebase Auth user:',u.uid)});
</script></body></html>
