<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>예수마음 관리자</title><style>body{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:#FAF6EE;color:#2B2A28;margin:0}.wrap{max-width:700px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid #E6DFD1;border-radius:16px;padding:20px;margin:14px 0}h1{color:#7A2E2E}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #eee;padding:14px 0}.btn{border:0;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}.ok{background:#7A2E2E;color:#fff}.no{background:#eee;color:#555}.msg{padding:10px;background:#F6ECD8;border-radius:9px;display:none}</style></head><body><div class="wrap"><h1>예수마음 관리자</h1><div id="status" class="msg"></div><div id="list" class="card">확인 중...</div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,collection,getDocs,doc,updateDoc}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';const cfg={apiKey:'AIzaSyCDlqRtl4O2rVzFXhn5ozpe11e34eRtQKI',authDomain:'jesus-heart-2c2b7.firebaseapp.com',projectId:'jesus-heart-2c2b7',storageBucket:'jesus-heart-2c2b7.firebasestorage.app',messagingSenderId:'583535424892',appId:'1:583535424892:web:6ec39032a3f2fb5eba20f9'};const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);const ADMIN_EMAILS=['mesuk80@naver.com','board-marker@naver.com'];const list=document.getElementById('list');function msg(t){const e=document.getElementById('status');e.textContent=t;e.style.display='block'}async function load(){const s=await getDocs(collection(db,'appdata'));const members=[];s.forEach(x=>{if(x.id.startsWith('member:'))members.push({id:x.id,...x.data()})});const pending=members.filter(m=>m.status==='pending');if(!pending.length){list.textContent='현재 승인 대기 중인 회원이 없습니다.';return}list.innerHTML=pending.map(m=>`<div class="row"><div><b>${m.name||'(이름 없음)'}</b><br><small>${m.email||''}</small></div><div><button class="btn ok" data-id="${m.id}" data-action="approve">승인</button> <button class="btn no" data-id="${m.id}" data-action="reject">거절</button></div></div>`).join('');document.querySelectorAll('button[data-action]').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'appdata',b.dataset.id),{status:b.dataset.action==='approve'?'approved':'rejected'});await load()})}onAuthStateChanged(auth,async u=>{if(!u){location.href='index.html';return}if(!ADMIN_EMAILS.includes((u.email||'').toLowerCase())){list.textContent='관리자 권한이 없습니다.';return}load().catch(e=>msg('관리자 데이터를 불러오지 못했습니다.'))});</script></body></html>
