<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>예수마음 - 함께 성경읽기</title><style>body{margin:0;background:#FAF6EE;color:#2B2A28;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}.wrap{max-width:520px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid #E6DFD1;border-radius:18px;padding:22px;margin-top:16px}h1{color:#7A2E2E;font-family:Georgia,"Batang",serif}.sub{color:#8C8577;font-size:13px;line-height:1.6}.count{font-size:32px;font-weight:800;color:#7A2E2E;margin:10px 0}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#7A2E2E;color:#fff;font-weight:700;font-size:15px}.done{background:#E9DED7;color:#7A2E2E}.note{margin-top:12px;font-size:12px;color:#8C8577;text-align:center}</style></head><body><main class="wrap"><h1>함께 성경읽기</h1><div class="sub">오늘도 우리 교회가 함께 말씀을 읽습니다.</div><section class="card"><div>오늘 성경읽기를 완료한 교인</div><div id="count" class="count">-명</div><button id="check" class="btn">오늘 읽었습니다</button><div id="note" class="note"></div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,setDoc,getDocs,collection,getDoc}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';const cfg={apiKey:'AIzaSyCDlqRtl4O2rVzFXhn5ozpe11e34eRtQKI',authDomain:'jesus-heart-2c2b7.firebaseapp.com',projectId:'jesus-heart-2c2b7',storageBucket:'jesus-heart-2c2b7.firebasestorage.app',messagingSenderId:'583535424892',appId:'1:583535424892:web:6ec39032a3f2fb5eba20f9'};const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),date=new Date().toISOString().slice(0,10);const count=document.getElementById('count'),btn=document.getElementById('check'),note=document.getElementById('note');let user=null;async function refresh(){const s=await getDocs(collection(db,'communityReading',date,'readers'));count.textContent=s.size+'명';if(user){const me=await getDoc(doc(db,'communityReading',date,'readers',user.uid));if(me.exists()){btn.textContent='오늘 읽기 완료';btn.classList.add('done');btn.disabled=true;note.textContent='오늘도 함께 읽었습니다.'}}}btn.onclick=async()=>{if(!user)return;await setDoc(doc(db,'communityReading',date,'readers',user.uid),{uid:user.uid,checked:true,checkedAt:new Date()});await refresh()};onAuthStateChanged(auth,async u=>{if(!u){location.href='index.html';return}user=u;await refresh()});</script></body></html>
