<style>
  :root {
    --color-bg: #FAF6EE;
    --color-surface: #FFFFFF;
    --color-text: #2B2A28;
    --color-muted: #8C8577;
    --color-accent: #7A2E2E;
    --color-accent-soft: #F3E4E1;
    --color-gold: #B08A3E;
    --color-gold-soft: #F6ECD8;
    --color-sage: #6B8F71;
    --color-sage-soft: #E7EFE6;
    --color-border: #E6DFD1;
    --font-display: 'Batang', 'Nanum Myeongjo', Georgia, serif;
    --font-body: 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; }

  body { margin: 0; background: var(--color-bg); font-family: var(--font-body); color: var(--color-text); }

  .app { max-width: 480px; margin: 0 auto; padding: 24px 20px 60px; }

  .header { text-align: center; margin-bottom: 10px; }
  .header .eyebrow { font-size: 12px; letter-spacing: 0.14em; color: var(--color-gold); font-weight: 600; }
  .header h1 { font-family: var(--font-display); font-size: 24px; font-weight: 700; margin: 6px 0 4px; color: var(--color-accent); }
  .header .date { font-size: 13px; color: var(--color-muted); }

  .streak-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; }
  .streak-flame { width: 20px; height: 20px; }
  .streak-text { font-size: 14px; color: var(--color-text); }
  .streak-num { font-weight: 700; color: var(--color-accent); font-family: var(--font-display); font-size: 17px; }

  .daily-message { margin: 14px 0 2px; padding: 12px 16px 12px 18px; background: var(--color-gold-soft); border-left: 3px solid var(--color-gold); border-radius: 8px; font-family: var(--font-display); font-size: 13.5px; color: var(--color-text); text-align: left; line-height: 1.6; }

  .identity-row { font-size: 11px; color: var(--color-muted); text-align: center; margin-top: 10px; }
  .identity-link { background: none; border: none; color: var(--color-gold); font-size: 11px; cursor: pointer; font-family: var(--font-body); text-decoration: underline; padding: 0; }
  .identity-edit-row { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
  .identity-edit-row input { border: 1px solid var(--color-border); border-radius: 8px; padding: 6px 8px; font-size: 12px; font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); }
  .identity-edit-row button { border: none; background: var(--color-accent); color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; font-family: var(--font-body); }

  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 18px 0 18px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 14px; padding: 5px; }
  .tab-btn { border: none; background: transparent; padding: 9px 2px; font-size: 11px; font-weight: 700; font-family: var(--font-body); color: var(--color-muted); border-radius: 10px; cursor: pointer; transition: background 0.15s ease, color 0.15s ease; }
  .tab-btn.active { background: var(--color-accent); color: #fff; }

  .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 16px; padding: 20px; margin-bottom: 18px; box-shadow: 0 1px 2px rgba(43,42,40,0.03); }
  .card h2 { font-family: var(--font-display); font-size: 17px; margin: 0 0 14px; color: var(--color-text); display: flex; align-items: center; gap: 8px; }
  .card h2 .badge { font-size: 11px; background: var(--color-gold-soft); color: var(--color-gold); padding: 2px 8px; border-radius: 999px; font-family: var(--font-body); font-weight: 600; }

  .read-toggle { width: 100%; border: none; border-radius: 12px; padding: 16px; font-size: 15px; font-weight: 700; font-family: var(--font-body); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform 0.12s ease, background 0.15s ease; }
  .read-toggle:active { transform: scale(0.98); }
  .read-toggle.off { background: var(--color-accent); color: #fff; }
  .read-toggle.on { background: var(--color-sage-soft); color: var(--color-sage); border: 1px solid var(--color-sage); }

  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 16px; }
  .month-dow { text-align: center; font-size: 11px; color: var(--color-muted); padding-bottom: 4px; }
  .day-cell { aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--color-muted); background: var(--color-bg); border: 1px solid transparent; }
  .day-cell.empty { background: transparent; }
  .day-cell.checked { background: var(--color-gold); color: #fff; font-weight: 700; }
  .day-cell.today { border: 1.5px solid var(--color-accent); }
  .day-cell.clickable { cursor: pointer; }
  .day-cell.clickable:active { transform: scale(0.9); }
  .day-cell.future { opacity: 0.35; }
  .calendar-toggle-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); border-radius: 12px; padding: 12px 14px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font-body); margin-top: 10px; }

  .verse-list, .prayer-list { display: flex; flex-direction: column; gap: 10px; }
  .verse-item { border: 1px solid var(--color-border); border-radius: 12px; padding: 14px; background: var(--color-bg); }
  .verse-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .verse-ref { font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--color-accent); margin-bottom: 4px; }
  .verse-text { font-size: 13px; color: var(--color-text); line-height: 1.5; white-space: pre-wrap; }

  .item-del { background: none; border: none; color: var(--color-muted); font-size: 16px; cursor: pointer; padding: 2px 4px; line-height: 1; flex-shrink: 0; }
  .item-del:hover { color: var(--color-accent); }

  .verse-check { margin-top: 10px; width: 100%; border: none; border-radius: 9px; padding: 10px; font-size: 13px; font-weight: 700; font-family: var(--font-body); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .verse-check.off { background: var(--color-accent-soft); color: var(--color-accent); }
  .verse-check.on { background: var(--color-sage-soft); color: var(--color-sage); border: 1px solid var(--color-sage); }

  .add-form { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .add-form input, .add-form textarea { border: 1px solid var(--color-border); border-radius: 10px; padding: 10px 12px; font-family: var(--font-body); font-size: 13px; background: var(--color-bg); color: var(--color-text); resize: vertical; }
  .add-form input:focus, .add-form textarea:focus { outline: 2px solid var(--color-gold); outline-offset: 1px; }
  .add-form textarea { min-height: 56px; }

  .add-btn { background: var(--color-accent); color: #fff; border: none; border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: var(--font-body); width: 100%; }
  .add-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .empty-hint { font-size: 13px; color: var(--color-muted); text-align: center; padding: 10px 0; }
  .loading { text-align: center; color: var(--color-muted); font-size: 13px; padding: 40px 0; }
  .footnote { text-align: center; font-size: 11px; color: var(--color-muted); margin-top: 8px; }

  .passbook-cover { background: linear-gradient(135deg, var(--color-accent) 0%, #5C2222 100%); border-radius: 16px; padding: 22px 20px; color: #F6ECD8; margin-bottom: 18px; position: relative; overflow: hidden; }
  .passbook-cover::after { content: ''; position: absolute; right: -30px; top: -30px; width: 120px; height: 120px; border: 1px solid rgba(246,236,216,0.15); border-radius: 50%; }
  .passbook-label { font-size: 11px; letter-spacing: 0.1em; color: #D9B77F; font-weight: 600; }
  .passbook-title { font-family: var(--font-display); font-size: 19px; margin: 4px 0 16px; }
  .passbook-balance-label { font-size: 12px; color: #D9B77F; margin-bottom: 2px; }
  .passbook-balance { font-family: var(--font-display); font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .passbook-sub { font-size: 12px; color: rgba(246,236,216,0.75); margin-top: 6px; }

  .quick-add-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .quick-add-btn { flex: 1; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); border-radius: 10px; padding: 10px 4px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: var(--font-body); }
  .quick-add-btn:active { transform: scale(0.97); }

  .custom-add-row { display: flex; gap: 8px; }
  .custom-add-row input { flex: 1; border: 1px solid var(--color-border); border-radius: 10px; padding: 10px 12px; font-size: 13px; font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); }
  .custom-add-row input:focus { outline: 2px solid var(--color-gold); outline-offset: 1px; }
  .custom-add-row .add-btn { width: 96px; }

  .ledger { margin-top: 18px; }
  .ledger-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px dashed var(--color-border); font-size: 12px; }
  .ledger-row:last-child { border-bottom: none; }
  .ledger-date { width: 56px; color: var(--color-muted); flex-shrink: 0; }
  .ledger-memo { flex: 1; color: var(--color-text); }
  .ledger-amount { color: var(--color-sage); font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .ledger-del { background: none; border: none; color: var(--color-muted); font-size: 13px; cursor: pointer; padding: 0 0 0 4px; flex-shrink: 0; }
  .ledger-del:hover { color: var(--color-accent); }

  .shared-note { font-size: 11px; color: var(--color-gold); background: var(--color-gold-soft); border-radius: 8px; padding: 8px 10px; margin-bottom: 14px; line-height: 1.5; }
  .community-block { background: var(--color-sage-soft); border-radius: 12px; padding: 14px 16px; margin-top: 16px; }
  .community-title { font-size: 12px; font-weight: 700; color: var(--color-sage); margin-bottom: 6px; }
  .community-names { font-size: 13px; color: var(--color-text); line-height: 1.6; }
  .community-total { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--color-sage); }
  .community-sub { font-size: 11px; color: var(--color-muted); margin-top: 4px; }
  .private-note { font-size: 11px; color: var(--color-sage); background: var(--color-sage-soft); border-radius: 8px; padding: 8px 10px; margin-bottom: 14px; line-height: 1.5; }

  .prayer-card { border: 1px solid var(--color-border); border-radius: 12px; padding: 14px; background: var(--color-bg); }
  .prayer-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .prayer-name { font-weight: 700; font-size: 13px; color: var(--color-accent); }
  .prayer-date { font-size: 11px; color: var(--color-muted); margin-top: 1px; }
  .prayer-content { font-size: 13px; line-height: 1.6; margin: 8px 0 10px; white-space: pre-wrap; }
  .reaction-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .reaction-btn { display: flex; align-items: center; gap: 5px; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-accent); border-radius: 999px; padding: 7px 12px; cursor: pointer; font-family: var(--font-body); }
  .reaction-emoji { font-size: 19px; line-height: 1; }
  .reaction-btn:active { transform: scale(0.94); }
  .reaction-count { font-size: 11px; font-weight: 700; color: var(--color-muted); }
  .reaction-toggle-btn { border: 1px dashed var(--color-border); background: transparent; color: var(--color-muted); border-radius: 999px; padding: 6px 11px; font-size: 12px; cursor: pointer; font-family: var(--font-body); }
  .reaction-toggle-btn:active { transform: scale(0.94); }

  .name-gate { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 16px; padding: 32px 22px; text-align: center; margin-top: 60px; }
  .name-gate-desc { font-size: 13px; color: var(--color-muted); margin: 0 0 18px; line-height: 1.5; }
  .name-gate-input { width: 100%; border: 1px solid var(--color-border); border-radius: 10px; padding: 12px; font-size: 14px; font-family: var(--font-body); margin-bottom: 12px; background: var(--color-bg); color: var(--color-text); text-align: center; }
  .name-gate-input:focus { outline: 2px solid var(--color-gold); outline-offset: 1px; }
  .name-gate-error { font-size: 12px; color: var(--color-accent); margin: -6px 0 12px; }

  .admin-entry { text-align: center; margin-top: 16px; }
  .admin-entry-link { background: none; border: none; color: var(--color-muted); font-size: 11px; cursor: pointer; font-family: var(--font-body); text-decoration: underline; padding: 0; opacity: 0.6; }

  .settings-block { margin-bottom: 18px; }
  .settings-label { font-size: 12px; font-weight: 700; color: var(--color-text); display: block; margin-bottom: 6px; }
  .settings-input { width: 100%; border: 1px solid var(--color-border); border-radius: 10px; padding: 10px 12px; font-size: 13px; font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); }
  .settings-hint { font-size: 11px; color: var(--color-muted); margin-top: 4px; }
  .swatch-row { display: flex; gap: 10px; }
  .swatch-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .swatch-btn.active { border-color: var(--color-text); }
  .font-option-list { display: flex; flex-direction: column; gap: 8px; }
  .font-option-btn { border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); border-radius: 10px; padding: 10px; font-size: 14px; text-align: left; cursor: pointer; }
  .font-option-btn.active { border-color: var(--color-accent); background: var(--color-accent-soft); }
  .admin-close-btn { width: 100%; margin-top: 10px; background: none; border: 1px solid var(--color-border); color: var(--color-muted); border-radius: 10px; padding: 10px; font-size: 13px; cursor: pointer; font-family: var(--font-body); }
  .member-manage-list { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; }
  .member-manage-row { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--color-border); border-radius: 10px; padding: 8px 12px; font-size: 13px; background: var(--color-bg); }

:19px}.home-brand-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.home-brand{display:flex;align-items:center;gap:10px;min-width:0}.home-brand-icon{width:48px;height:48px;border-radius:14px;border:1px solid var(--color-border);box-shadow:0 2px 8px rgba(43,42,40,.08);background:#fff;object-fit:cover;flex:0 0 auto}.home-brand-title{font-family:var(--font-display);font-size:27px;font-weight:700;color:var(--color-accent);line-height:1.1}.home-brand-sub{font-size:11px;color:var(--color-muted);margin-top:4px}.home-profile-btn{display:flex;align-items:center;gap:5px;border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-accent);border-radius:12px;padding:8px 10px;font-size:11px;font-weight:700;font-family:var(--font-body);cursor:pointer;box-shadow:0 2px 8px rgba(43,42,40,.05);flex:0 0 auto}.home-verse2{margin-top:16px;padding:15px 16px;border:1px solid var(--color-border);border-radius:16px;background:rgba(255,255,255,.7);text-align:center;box-shadow:0 2px 8px rgba(43,42,40,.04)}.home-verse2 .v{font-family:var(--font-display);font-size:13px;line-height:1.7}.home-verse2 .r{font-size:10px;color:var(--color-muted);margin-top:5px}.home-nav-hidden{display:none}
  .home-hero { text-align:center; padding: 8px 0 16px; }
  .home-hero .eyebrow { font-size:12px; letter-spacing:.14em; color:var(--color-gold); font-weight:700; }
  .home-hero h2 { font-family:var(--font-display); font-size:24px; margin:6px 0 4px; color:var(--color-accent); }

<script>
  // Firebase 설정 (jesus-heart 프로젝트)
  const firebaseConfig = {
    apiKey: "AIzaSyCDlqRtl4O2rVzFXhn5ozpe11e34eRtQKI",
    authDomain: "jesus-heart-2c2b7.firebaseapp.com",
    projectId: "jesus-heart-2c2b7",
    storageBucket: "jesus-heart-2c2b7.firebasestorage.app",
    messagingSenderId: "583535424892",
    appId: "1:583535424892:web:6ec39032a3f2fb5eba20f9"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // 기존 앱 코드가 쓰던 window.storage 인터페이스를 그대로 유지하면서
  // shared=false는 이 기기의 localStorage에, shared=true는 Firestore(appdata 컬렉션)에 저장한다.
  window.storage = {
    async get(key, shared) {
      if (!shared) {
        const v = localStorage.getItem('local:' + key);
        return v !== null ? { key, value: v, shared } : null;
      }
      const snap = await db.collection('appdata').doc(key).get();
      if (!snap.exists) return null;
      return { key, value: snap.data().value, shared };
    },
    async set(key, value, shared) {
      if (!shared) {
        localStorage.setItem('local:' + key, value);
        return { key, value, shared };
      }
      await db.collection('appdata').doc(key).set({ value, updatedAt: Date.now() });
      return { key, value, shared };
    },
    async listByPrefix(prefix) {
      const snap = await db.collection('appdata')
        .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
        .where(firebase.firestore.FieldPath.documentId(), '<', prefix + '\uf8ff')
        .get();
      return snap.docs.map(d => ({ key: d.id, value: d.data().value }));
    },
    async delete(key, shared) {
      if (!shared) {
        localStorage.removeItem('local:' + key);
        return { key, deleted: true, shared };
      }
      await db.collection('appdata').doc(key).delete();
      return { key, deleted: true, shared };
    },
  };
</script>

  const dayIndex = Math.floor(Date.now() / 86400000);

}

function pad(n) { return String(n).padStart(2, '0'); }

function computeStreak(readingLog) {
  let streak = 0;
  let cursor = new Date();
  if (!readingLog[todayKey(cursor)]) cursor.setDate(cursor.getDate() - 1);
  while (readingLog[todayKey(cursor)]) { streak += 1; cursor.setDate(cursor.getDate() - 1); }

}

function MonthGrid({ readingLog, onDayClick }) {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const dows = ['일', '월', '화', '수', '목', '금', '토'];
  const todayStr = todayKey(now);
  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push(<div key={`empty-${i}`} className="day-cell empty"></div>);
  for (let day = 1; day <= daysInMonth; day++) {
    const d = new Date(year, month, day);
    const key = todayKey(d);
    const checked = !!readingLog[key];
    const isToday = key === todayStr;
    const isFuture = key > todayStr;
    const clickable = !!onDayClick && !isFuture;
    cells.push(
      <div
        key={key}
        className={`day-cell ${checked ? 'checked' : ''} ${isToday ? 'today' : ''} ${clickable ? 'clickable' : ''} ${isFuture ? 'future' : ''}`}
        onClick={clickable ? () => onDayClick(key) : undefined}
      >
        {day}
      </div>
    );
  }
  return (
    <div className="month-grid">
      {dows.map(d => <div key={d} className="month-dow">{d}</div>)}
      {cells}
    </div>
  );
}

function MemberManageSection() {
  const [members, setMembers] = useState(null);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const list = await window.storage.listByPrefix(MEMBER_PREFIX);
      const parsed = list.map(item => {
        try {
          const data = JSON.parse(item.value);
          return { key: item.key, name: data.name || '(이름 없음)' };
        } catch (e) {
          return { key: item.key, name: '(이름 없음)' };
        }
      });
      parsed.sort((a, b) => a.name.localeCompare(b.name));
      setMembers(parsed);
    } catch (e) {
      setMembers([]);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { load(); }, [load]);

  const handleRemove = async (m) => {
    if (!window.confirm(`${m.name}님의 성경읽기·기도통장 기록을 삭제할까요?\n(이미 올린 기도제목·감사나눔 글은 지워지지 않아요)`)) return;

function ReadTab({ member, today, toggleReadingDate }) {
  const readToday = !!member.readingLog[today];
  const [others, setOthers] = useState(null);
  const [showCalendar, setShowCalendar] = useState(false);
  const streak = computeStreak(member.readingLog || {});

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const list = await window.storage.listByPrefix(MEMBER_PREFIX);
        const names = list
          .map(item => { try { return JSON.parse(item.value); } catch (e) { return null; } })
          .filter(m => m && m.readingLog && m.readingLog[today] && m.name)
          .map(m => m.name);
        if (!cancelled) setOthers(names);
      } catch (e) {
        if (!cancelled) setOthers([]);
      }
    })();
    return () => { cancelled = true; };
  }, [today]);

  return (
    <div className="card">
      <h2>말씀 체크</h2>
      <button className={`read-toggle ${readToday ? 'on' : 'off'}`} onClick={() => toggleReadingDate(today)}>{readToday ? '✓ 오늘 읽었어요' : '오늘 읽은 말씀 체크하기'}</button>

      <button className="calendar-toggle-btn" onClick={() => setShowCalendar(s => !s)}>
        <span>연속 {streak}일째 · 이번 달 캘린더 {showCalendar ? '접기' : '보기'}</span>
        <span>{showCalendar ? '▲' : '▼'}</span>
      </button>

      {showCalendar && (
        <>
          <MonthGrid readingLog={member.readingLog} onDayClick={toggleReadingDate} />
          <div className="settings-hint" style={{ textAlign: 'center', marginTop: 10 }}>지난 날짜를 눌러서 놓친 날도 체크할 수 있어요</div>
        </>
      )}

      <div className="community-block">
        <div className="community-title">오늘 함께 읽은 성도님들</div>
        {others === null ? (
          <div className="empty-hint">불러오는 중...</div>
        ) : others.length === 0 ? (
          <div className="community-names">아직 없어요, 첫 번째로 체크해보세요!</div>

  );
}

function BankTab({ member, addPrayerEntry, deletePrayerEntry }) {
  const [minutesInput, setMinutesInput] = useState('');
  const [community, setCommunity] = useState(null);
  const ledger = member.prayerLedger || [];
  const chronological = [...ledger].sort((a, b) => a.createdAt - b.createdAt);
  let running = 0;
  const withBalance = chronological.map(e => { running += e.amount; return { ...e, balanceAfter: running }; });
  const totalBalance = running;
  const totalMinutes = ledger.reduce((s, e) => s + e.minutes, 0);
  const displayList = [...withBalance].reverse();

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const list = await window.storage.listByPrefix(MEMBER_PREFIX);
        let minutes = 0, amount = 0, people = 0;
        list.forEach(item => {
          try {
            const m = JSON.parse(item.value);
            const entries = m.prayerLedger || [];
            if (entries.length > 0) people += 1;
            entries.forEach(e => { minutes += e.minutes; amount += e.amount; });
          } catch (e) { /* skip */ }
        });
        if (!cancelled) setCommunity({ minutes, amount, people });
      } catch (e) {
        if (!cancelled) setCommunity({ minutes: 0, amount: 0, people: 0 });
      }
    })();
    return () => { cancelled = true; };
  }, []);

  const handleQuickAdd = (m) => addPrayerEntry(m);
  const handleCustomAdd = () => {
    const m = parseInt(minutesInput, 10);
    if (!m || m <= 0) return;
    addPrayerEntry(m);
    setMinutesInput('');
  };

  return (
    <div>
      <div className="passbook-cover">
        <div className="passbook-label">FAITH BANK</div>
        <div className="passbook-title">우리들의 기도통장</div>
        <div className="passbook-balance-label">현재 잔액</div>
        <div className="passbook-balance">{fmtWon(totalBalance)}</div>
        <div className="passbook-sub">누적 기도시간 {totalMinutes}분 · 1분 기도 = {fmtWon(WON_PER_MINUTE)} 적립</div>
      </div>

      <div className="community-block">
        <div className="community-title">우리 교회 전체 기도통장</div>
        {community === null ? (
          <div className="empty-hint">불러오는 중...</div>
        ) : (
          <>
            <div className="community-total">{fmtWon(community.amount)}</div>
            <div className="community-sub">{community.people}명이 함께 · 총 {community.minutes}분 기도</div>
          </>
        )}
      </div>

      <div className="card">
        <h2>오늘 기도 적립하기</h2>
        <div className="shared-note">기도통장도 성도님들과 함께 공유돼요.</div>
        <div className="quick-add-row">
          <button className="quick-add-btn" onClick={() => handleQuickAdd(5)}>+5분</button>
          <button className="quick-add-btn" onClick={() => handleQuickAdd(10)}>+10분</button>
          <button className="quick-add-btn" onClick={() => handleQuickAdd(30)}>+30분</button>
        </div>
        <div className="custom-add-row">
          <input type="number" inputMode="numeric" placeholder="직접 입력 (분)" value={minutesInput} onChange={e => setMinutesInput(e.target.value)} />
          <button className="add-btn" onClick={handleCustomAdd} disabled={!minutesInput}>입금하기</button>
        </div>
        {ledger.length === 0 ? (
          <div className="empty-hint">아직 적립 내역이 없어요. 기도하고 적립해 보세요!</div>
        ) : (
          <div className="ledger">
            {displayList.map(e => (
              <div key={e.id} className="ledger-row">
                <div className="ledger-date">{fmtShortDate(e.date)}</div>
                <div className="ledger-memo">기도 {e.minutes}분 적립</div>
                <div className="ledger-amount">+{fmtWon(e.amount)}</div>
                <button className="ledger-del" onClick={() => deletePrayerEntry(e.id)} title="삭제">✕</button>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

      try {
        const idRes = await window.storage.get('my-id', false);
        const nameRes = await window.storage.get('my-name', false);
        if (idRes && idRes.value && nameRes && nameRes.value) {
          setMyId(idRes.value);
          setMyName(nameRes.value);
          await loadMember(idRes.value);
        } else {
          setMemberLoading(false);
        }
      } catch (e) {
        setMemberLoading(false);
      } finally {
        setIdentityLoading(false);
      }
    })();

    (async () => {
      try {
        const result = await window.storage.get(NOTE_KEY, false);
        if (result && result.value) {
          const parsed = JSON.parse(result.value);
          setNoteData({ entries: parsed.entries || [] });
        } else {
          setNoteData({ entries: [] });
        }
      } catch (e) {
        setNoteData({ entries: [] });
      } finally {
        setNoteLoading(false);
      }
    })();

    (async () => {
      try {
        const result = await window.storage.get(PRAYER_WALL_KEY, true);
        if (result && result.value) setRequests(JSON.parse(result.value));
        else setRequests([]);
      } catch (e) {
        setRequests([]);
      } finally {
        setWallLoading(false);
      }
    })();

    (async () => {
      try {
        const result = await window.storage.get(GRATITUDE_KEY, true);
        if (result && result.value) setGratitudeEntries(JSON.parse(result.value));
        else setGratitudeEntries([]);
      } catch (e) {
        setGratitudeEntries([]);
      } finally {
        setGratitudeLoading(false);
      }
    })();

    (async () => {
      try {
        const result = await window.storage.get(SETTINGS_KEY, true);
        if (result && result.value) setSettings({ ...DEFAULT_SETTINGS, ...JSON.parse(result.value) });
        else setSettings(DEFAULT_SETTINGS);
      } catch (e) {
        setSettings(DEFAULT_SETTINGS);
      } finally {
        setSettingsLoading(false);
      }
    })();
  }, [loadMember]);

  useEffect(() => {
    if (identityLoading || settingsLoading || !myId) return;
    (async () => {
      try {
        const result = await window.storage.get('my-access-version', false);
        const localVersion = result && result.value ? parseInt(result.value, 10) : 0;
        if (localVersion !== settings.accessVersion) {
          setNeedsReverify(true);
        }
      } catch (e) {
        setNeedsReverify(true);
      }
    })();
  }, [identityLoading, settingsLoading, myId, settings.accessVersion]);

  const handleReverify = async () => {
    try { await window.storage.set('my-access-version', String(settings.accessVersion), false); } catch (e) { console.error(e); }
    setNeedsReverify(false);
  };

  const persistMember = useCallback(async (next) => {
    setMember(next);
    if (!myId) return;
    try { await window.storage.set(`${MEMBER_PREFIX}${myId}`, JSON.stringify(next), true); }
    catch (e) { console.error('저장 실패', e); }
  }, [myId]);

  const persistNoteData = useCallback(async (next) => {
    setNoteData(next);
    try { await window.storage.set(NOTE_KEY, JSON.stringify(next), false); }
    catch (e) { console.error('저장 실패', e); }
  }, []);

  const persistWall = useCallback(async (next) => {
    setRequests(next);
    try { await window.storage.set(PRAYER_WALL_KEY, JSON.stringify(next), true); }
    catch (e) { console.error('저장 실패', e); }
  }, []);

  const persistGratitude = useCallback(async (next) => {
    setGratitudeEntries(next);
    try { await window.storage.set(GRATITUDE_KEY, JSON.stringify(next), true); }
    catch (e) { console.error('저장 실패', e); }
  }, []);

  const persistSettings = useCallback(async (next) => {
    setSettings(next);
    try { await window.storage.set(SETTINGS_KEY, JSON.stringify(next), true); }
    catch (e) { console.error('저장 실패', e); }
  }, []);

  const completeOnboarding = async (nameRaw) => {
    const trimmed = nameRaw.trim();
    if (!trimmed) return;
    const id = `u${Date.now()}${Math.random().toString(36).slice(2, 8)}`;
    try {
      await window.storage.set('my-id', id, false);
      await window.storage.set('my-name', trimmed, false);
      await window.storage.set('my-access-version', String(settings.accessVersion), false);
    } catch (e) { console.error(e); }
    const newMember = { name: trimmed, readingLog: {}, prayerLedger: [] };
    try { await window.storage.set(`${MEMBER_PREFIX}${id}`, JSON.stringify(newMember), true); } catch (e) { console.error(e); }
    setMyId(id);
    setMyName(trimmed);
    setMember(newMember);
    setMemberLoading(false);
  };

  const renameSelf = async () => {
    const trimmed = renameInput.trim();
    if (!trimmed || !myId) return;
    setMyName(trimmed);
    try { await window.storage.set('my-name', trimmed, false); } catch (e) { console.error(e); }
    const nextMember = { ...member, name: trimmed };
    setMember(nextMember);
    try { await window.storage.set(`${MEMBER_PREFIX}${myId}`, JSON.stringify(nextMember), true); } catch (e) { console.error(e); }
    setShowRename(false);
  };

  const handleAdminSubmit = (pw) => {
    if (pw === settings.adminPasscode) {
      setAdminUnlocked(true);
      setShowAdminLogin(false);
      setTab('admin');
      return true;
    }
    return false;
  };

  if (identityLoading || settingsLoading) return <div className="loading">불러오는 중...</div>;

  const themeVars = themeStyleVars(settings.theme, settings.font);

  if (showAdminLogin) {
    return (
      <div className="app" style={themeVars}>
        <div className="header"><div className="eyebrow">예수마음</div></div>
        <AdminGate onSubmit={handleAdminSubmit} onCancel={() => setShowAdminLogin(false)} />
      </div>
    );
  }

  if (tab === 'admin' && adminUnlocked) {
    return (
      <div className="app" style={themeVars}>
        <div className="header">
          <div className="eyebrow">예수마음</div>
          <h1 style={{ fontSize: 20 }}>관리자 설정</h1>
        </div>
        <AdminPanel settings={settings} onSave={persistSettings} onClose={() => { setTab('read'); }} />
      </div>
    );
  }

  if (!myId) return <NameGate settings={settings} onSubmit={completeOnboarding} />;
  if (needsReverify) return <ReverifyGate settings={settings} myName={myName} onSubmit={handleReverify} />;
  if (memberLoading || !member || noteLoading || !noteData) return <div className="loading">불러오는 중...</div>;

  const streak = computeStreak(member.readingLog || {});
  const readToday = !!member.readingLog[today];
  const dailyMessage = getDailyGreeting(readToday);

  const toggleReadingDate = (dateStr) => {
    const next = { ...member, readingLog: { ...member.readingLog } };
    if (next.readingLog[dateStr]) delete next.readingLog[dateStr];
    else next.readingLog[dateStr] = true;
    persistMember(next);
  };

  const addPrayerEntry = (minutes) => {
    const entry = { id: `p${Date.now()}`, date: today, minutes, amount: minutes * WON_PER_MINUTE, createdAt: Date.now() };
    persistMember({ ...member, prayerLedger: [...(member.prayerLedger || []), entry] });
  };

  const deletePrayerEntry = (id) => {
    if (!window.confirm('이 기도 적립 내역을 삭제할까요?')) return;
    persistMember({ ...member, prayerLedger: (member.prayerLedger || []).filter(e => e.id !== id) });
  };

  const addNote = (text) => {
    const entry = { id: `n${Date.now()}`, date: today, content: text, createdAt: Date.now() };
    persistNoteData({ ...noteData, entries: [...noteData.entries, entry] });
  };

  const deleteNote = (id) => {
    if (!window.confirm('이 말씀노트를 삭제할까요?')) return;
    persistNoteData({ ...noteData, entries: noteData.entries.filter(e => e.id !== id) });
  };

  const addRequest = (name, content) => {
    const item = { id: `r${Date.now()}`, name, content, createdAt: Date.now(), reactions: {}, authorId: myId };
    persistWall([...requests, item]);
  };

  const prayFor = (id, emoji) => {
    persistWall(requests.map(r => {
      if (r.id !== id) return r;
      const reactions = { ...(r.reactions || {}) };
      reactions[emoji] = (reactions[emoji] || 0) + 1;
      return { ...r, reactions };
    }));
  };

  const deleteRequest = (id) => {
    if (!window.confirm('이 기도제목을 삭제할까요?')) return;
    persistWall(requests.filter(r => r.id !== id));
  };

  const addGratitude = (name, content) => {
    const item = { id: `g${Date.now()}`, name, content, createdAt: Date.now(), reactions: {}, authorId: myId };
    persistGratitude([...gratitudeEntries, item]);
  };

  const joyFor = (id, emoji) => {
    persistGratitude(gratitudeEntries.map(r => {
      if (r.id !== id) return r;
      const reactions = { ...(r.reactions || {}) };
      reactions[emoji] = (reactions[emoji] || 0) + 1;
      return { ...r, reactions };
    }));
  };

  const deleteGratitude = (id) => {
    if (!window.confirm('이 감사나눔 글을 삭제할까요?')) return;
    persistGratitude(gratitudeEntries.filter(r => r.id !== id));
  };

  const TABS = [
    { key: 'home', label: '홈' },
    { key: 'read', label: '말씀' },
    { key: 'bank', label: '기도' },
    { key: 'community', label: '공동체' },
    { key: 'mypage', label: '마이' },
  ];

  return (
    <div className="app" style={themeVars}>
      <div className="header">
        <div className="date">{fmtHeaderDate()}</div>
      </div>

      <div className={`tabs bottom-tabs ${tab === 'home' ? 'home-nav-hidden' : ''}`}>
        {TABS.map(t => <button key={t.key} className={`tab-btn ${tab === t.key ? 'active' : ''}`} onClick={() => setTab(t.key)}>{t.label}</button>)}
      </div>
      {tab === 'home' && <HomeTab member={member} myName={myName} requests={requests} setTab={setTab} today={today} theme={settings.theme} font={settings.font} onOpenMyPage={()=>setTab('mypage')} />}
      {tab === 'read' && <ReadTab member={member} today={today} toggleReadingDate={toggleReadingDate} />}
      {tab === 'note' && <NoteTab noteData={noteData} today={today} addNote={addNote} deleteNote={deleteNote} />}
      {tab === 'bank' && <BankTab member={member} addPrayerEntry={addPrayerEntry} deletePrayerEntry={deletePrayerEntry} />}
      {tab === 'community' && <WallTab requests={requests} loading={wallLoading} myId={myId} myName={myName} isAdmin={adminUnlocked} addRequest={addRequest} prayFor={prayFor} deleteRequest={deleteRequest} />}
      {tab === 'gratitude' && <GratitudeTab entries={gratitudeEntries} loading={gratitudeLoading} myId={myId} myName={myName} isAdmin={adminUnlocked} addEntry={addGratitude} joyFor={joyFor} deleteEntry={deleteGratitude} />}
      {tab === 'mypage' && <MyPageTab myName={myName} setMyName={setMyName} member={member} noteData={noteData} settings={settings} onSaveSettings={persistSettings} onOpenAdmin={()=>setShowAdminLogin(true)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
