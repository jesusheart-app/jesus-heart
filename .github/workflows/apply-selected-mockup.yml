name: Apply selected pastel home mockup
on:
  push:
    paths:
      - '.github/workflows/apply-selected-mockup.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace home design with selected mockup layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index_v2.html')
          s=p.read_text(encoding='utf-8')
          old=re.compile(r'function HomeTab\(\{.*?\n\}\n\nfunction MyPageTab',re.S)
          new=r'''function HomeTab({ member, myName, requests, setTab, today, theme, font, onOpenMyPage }) {
            const items=[
              {key:'word',title:'말씀 체크',sub:'오늘 읽은 말씀을 체크해요',tab:'read',icon:'book'},
              {key:'prayer',title:'기도',sub:'기도를 기록하고 함께 기도해요',tab:'bank',icon:'prayer'},
              {key:'note',title:'말씀노트',sub:'말씀을 기록해요',tab:'note',icon:'note'},
              {key:'gratitude',title:'감사나눔',sub:'감사를 기록하고 나눠요',tab:'gratitude',icon:'heart'}
            ];
            const iconSvg=(type)=>{
              if(type==='book') return <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 13c8-3 17-2 24 4v38c-7-5-16-6-24-3V13Z"/><path d="M56 13c-8-3-17-2-24 4v38c7-5 16-6 24-3V13Z"/><path d="M32 17v38"/><path d="m18 35 7 7 14-17"/></svg>;
              if(type==='prayer') return <img src="assets/prayer-hands-soft.svg" alt="기도"/>;
              if(type==='note') return <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M13 8h29l9 9v39H13V8Z"/><path d="M42 8v11h9"/><path d="M21 28h19M21 36h19M21 44h12"/><path d="m39 39 8 8-13 13-9 2 2-9 12-14Z"/></svg>;
              return <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 55S11 42 11 25c0-7 5-12 12-12 4 0 8 2 9 7 1-5 5-7 9-7 7 0 12 5 12 12 0 17-21 30-21 30Z"/><path d="M21 31c3 3 7 5 11 5s8-2 11-5"/></svg>;
            };
            return <div className="home-mockup">
              <div className="home-brand-row">
                <div className="home-brand"><img className="home-brand-icon" src="icon-192.png" alt="예수마음 아이콘"/><div><div className="home-brand-title">예수마음</div><div className="home-brand-sub">오늘도 예수님의 마음으로</div></div></div>
                <button className="home-profile-btn" onClick={onOpenMyPage}>♟ 내 정보</button>
              </div>
              <div className="home-redesign">
                {items.map(item=><button key={item.key} className={`mock-card ${item.key}`} onClick={()=>setTab(item.tab)}>
                  <div className="mock-photo"><div className="mock-photo-art"></div></div>
                  <div className="mock-lower"><div className="mock-icon">{iconSvg(item.icon)}</div><div className="mock-copy"><div className="mock-title">{item.title}</div><div className="mock-sub">{item.sub}</div></div><div className="mock-arrow">›</div></div>
                </button>)}
              </div>
              <div className="home-verse2"><div className="v">주 예수를 믿으라 그리하면 너와 네 집이 구원을 받으리라 하고</div><div className="r">사도행전 16:31 · 개역개정</div></div>
            </div>
          }

          function MyPageTab'''
          s2=old.sub(new,s, count=1)
          if s2==s: raise SystemExit('HomeTab block not found')
          s=s2
          start='<!-- second-home-button-design-v2 -->'; end='<!-- /second-home-button-design-v2 -->'
          css=r'''<!-- second-home-button-design-v2 -->
          <style>
          .home-mockup{margin-top:4px}
          .home-mockup .home-brand-row{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px;padding:0 1px}
          .home-mockup .home-brand{display:flex;align-items:center;gap:10px}
          .home-mockup .home-brand-icon{width:48px;height:48px;border-radius:14px;box-shadow:0 3px 9px rgba(70,45,35,.14)}
          .home-mockup .home-brand-title{font-family:var(--font-display);font-size:25px;font-weight:800;color:#7A2E2E;line-height:1.05}
          .home-mockup .home-brand-sub{font-size:10px;color:#8C8577;margin-top:4px}
          .home-mockup .home-profile-btn{border:1px solid #E6DFD1;background:#fff;border-radius:18px;padding:9px 13px;color:#6E6258;font-size:11px;font-weight:700;box-shadow:0 2px 7px rgba(70,55,45,.06)}
          .home-mockup .home-redesign{display:grid;grid-template-columns:1fr 1fr;gap:12px}
          .home-mockup .mock-card{border:1px solid rgba(255,255,255,.95);padding:0;min-width:0;height:176px;border-radius:19px;overflow:hidden;box-shadow:0 3px 12px rgba(70,55,45,.08);display:flex;flex-direction:column;text-align:left;position:relative;background:#fff}
          .home-mockup .mock-card:active{transform:scale(.985)}
          .home-mockup .mock-photo{height:92px;position:relative;overflow:hidden}
          .home-mockup .mock-photo-art{position:absolute;inset:0}
          .home-mockup .word .mock-photo{background:linear-gradient(135deg,#dbe8d7,#f2e9d5)}
          .home-mockup .word .mock-photo-art{background:radial-gradient(circle at 30% 65%,rgba(255,255,255,.8) 0 18%,transparent 19%),linear-gradient(135deg,transparent 42%,rgba(255,255,255,.65) 43% 58%,transparent 59%),radial-gradient(circle at 76% 25%,rgba(255,255,255,.45),transparent 30%)}
          .home-mockup .prayer .mock-photo{background:linear-gradient(135deg,#d8e6e7,#e9ded3)}
          .home-mockup .prayer .mock-photo-art{background:radial-gradient(circle at 72% 62%,rgba(255,255,255,.9) 0 19%,transparent 20%),linear-gradient(120deg,transparent 43%,rgba(128,100,70,.25) 44% 48%,transparent 49%),radial-gradient(circle at 22% 24%,rgba(255,255,255,.65),transparent 28%)}
          .home-mockup .note .mock-photo{background:linear-gradient(135deg,#ddd5d7,#eee6dc)}
          .home-mockup .note .mock-photo-art{background:linear-gradient(20deg,transparent 44%,rgba(255,255,255,.78) 45% 78%,transparent 79%),linear-gradient(65deg,transparent 52%,rgba(45,40,38,.25) 53% 56%,transparent 57%)}
          .home-mockup .gratitude .mock-photo{background:linear-gradient(135deg,#eee0cf,#f4d9c7)}
          .home-mockup .gratitude .mock-photo-art{background:radial-gradient(circle at 62% 52%,rgba(255,255,255,.9) 0 14%,transparent 15%),radial-gradient(circle at 68% 40%,rgba(255,255,255,.75) 0 8%,transparent 9%),radial-gradient(circle at 54% 38%,rgba(255,255,255,.75) 0 7%,transparent 8%)}
          .home-mockup .mock-lower{flex:1;position:relative;padding:31px 13px 9px}
          .home-mockup .word .mock-lower{background:#eff6ee}.home-mockup .prayer .mock-lower{background:#f0eaf6}.home-mockup .note .mock-lower{background:#faf0e1}.home-mockup .gratitude .mock-lower{background:#eaf4f5}
          .home-mockup .mock-icon{position:absolute;left:14px;top:-34px;width:58px;height:58px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 9px rgba(60,50,45,.11);z-index:2}
          .home-mockup .mock-icon svg,.home-mockup .mock-icon img{width:34px;height:34px;object-fit:contain;display:block}
          .home-mockup .mock-icon svg{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
          .home-mockup .word .mock-icon svg{stroke:#3D9A7A}.home-mockup .prayer .mock-icon img{filter:none}.home-mockup .note .mock-icon svg{stroke:#B9783B}.home-mockup .gratitude .mock-icon svg{stroke:#5C8E89}
          .home-mockup .mock-copy{padding-right:28px}
          .home-mockup .mock-title{font-size:17px;font-weight:800;line-height:1.25}.home-mockup .word .mock-title{color:#39765f}.home-mockup .prayer .mock-title{color:#6e527c}.home-mockup .note .mock-title{color:#a56c39}.home-mockup .gratitude .mock-title{color:#4c7e7b}
          .home-mockup .mock-sub{font-size:10px;color:#77716a;margin-top:5px;line-height:1.35}
          .home-mockup .mock-arrow{position:absolute;right:10px;bottom:10px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;color:#77716a;font-size:18px;box-shadow:0 1px 4px rgba(60,50,45,.06)}
          .home-mockup .home-verse2{margin-top:14px;border:1px solid #E6DFD1;border-radius:14px;background:#fffdf9;padding:14px 12px 11px;text-align:center;box-shadow:0 2px 8px rgba(70,55,45,.04)}
          .home-mockup .home-verse2 .v{font-family:var(--font-display);font-size:13px;line-height:1.5;color:#5b4c43}.home-mockup .home-verse2 .r{font-size:9px;color:#9b8277;margin-top:5px}
          @media(max-width:380px){.home-mockup .home-redesign{gap:9px}.home-mockup .mock-card{height:164px}.home-mockup .mock-photo{height:84px}.home-mockup .mock-title{font-size:15px}.home-mockup .mock-sub{font-size:9px}}
          </style>
          <!-- /second-home-button-design-v2 -->'''
          pattern=re.compile(re.escape(start)+r'.*?'+re.escape(end),re.S)
          if pattern.search(s): s=pattern.sub(css,s)
          else: s=s.replace('</body>',css+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index_v2.html
          git rm .github/workflows/apply-selected-mockup.yml
          git commit -m 'Match home screen to selected pastel mockup'
          git push
