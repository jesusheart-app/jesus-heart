name: Apply home redesign
on:
  push:
    paths:
      - '.github/workflows/apply-home-redesign.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Modify home only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index_v2.html')
          s=p.read_text(encoding='utf-8')
          marker='  .home-hero { text-align:center; padding: 8px 0 16px; }'
          css='''  .home-redesign{display:grid;grid-template-columns:1fr 1fr;gap:12px}.home-redesign button{position:relative;min-height:188px;border:1px solid var(--color-border);border-radius:20px;background:var(--color-surface);padding:0;overflow:hidden;text-align:left;cursor:pointer;box-shadow:0 4px 14px rgba(43,42,40,.07);font-family:var(--font-body)}.home-redesign button:active{transform:scale(.985)}.home-redesign .visual{height:92px;position:relative;overflow:hidden}.home-redesign .visual:after{content:"";position:absolute;width:125px;height:125px;border-radius:50%;right:-38px;top:-50px;opacity:.25;background:var(--color-sage)}.home-redesign .word .visual{background:linear-gradient(135deg,#E7EFE6,#F6F5EF)}.home-redesign .prayer .visual{background:linear-gradient(135deg,var(--color-accent-soft),var(--color-bg))}.home-redesign .note .visual{background:linear-gradient(135deg,#F6ECD8,var(--color-bg))}.home-redesign .gratitude .visual{background:linear-gradient(135deg,#E7EFE6,var(--color-bg))}.home-redesign .icon{position:absolute;left:14px;bottom:11px;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;z-index:1;font-size:27px;font-weight:700}.home-redesign .word .icon,.home-redesign .gratitude .icon{background:var(--color-sage)}.home-redesign .prayer .icon{background:var(--color-accent)}.home-redesign .note .icon{background:var(--color-gold)}.home-redesign .body{padding:12px 14px 14px}.home-redesign .title{font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--color-accent)}.home-redesign .word .title,.home-redesign .gratitude .title{color:var(--color-sage)}.home-redesign .note .title{color:var(--color-gold)}.home-redesign .sub{font-size:11px;color:var(--color-muted);margin-top:5px;line-height:1.45}.home-redesign .arrow{position:absolute;right:11px;bottom:11px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--color-accent);font-size:19px}.home-brand-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.home-brand{display:flex;align-items:center;gap:10px;min-width:0}.home-brand-icon{width:48px;height:48px;border-radius:14px;border:1px solid var(--color-border);box-shadow:0 2px 8px rgba(43,42,40,.08);background:#fff;object-fit:cover;flex:0 0 auto}.home-brand-title{font-family:var(--font-display);font-size:27px;font-weight:700;color:var(--color-accent);line-height:1.1}.home-brand-sub{font-size:11px;color:var(--color-muted);margin-top:4px}.home-profile-btn{display:flex;align-items:center;gap:5px;border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-accent);border-radius:12px;padding:8px 10px;font-size:11px;font-weight:700;font-family:var(--font-body);cursor:pointer;box-shadow:0 2px 8px rgba(43,42,40,.05);flex:0 0 auto}.home-verse2{margin-top:16px;padding:15px 16px;border:1px solid var(--color-border);border-radius:16px;background:rgba(255,255,255,.7);text-align:center;box-shadow:0 2px 8px rgba(43,42,40,.04)}.home-verse2 .v{font-family:var(--font-display);font-size:13px;line-height:1.7}.home-verse2 .r{font-size:10px;color:var(--color-muted);margin-top:5px}.home-nav-hidden{display:none}\n'''
          if marker not in s: raise SystemExit('marker not found')
          s=s.replace(marker,css+marker,1)
          a=s.index('function HomeTab('); b=s.index('\n\nfunction MyPageTab',a)
          home='''function HomeTab({ member, myName, requests, setTab, today, theme, font, onOpenMyPage }) {\n  const items=[{key:'word',title:'말씀 체크',sub:'오늘 읽은 말씀을 체크해요',tab:'read',icon:'✓'},{key:'prayer',title:'기도',sub:'기도를 기록하고 함께 기도해요',tab:'bank',icon:'✦'},{key:'note',title:'말씀노트',sub:'말씀을 기록해요',tab:'note',icon:'✎'},{key:'gratitude',title:'감사나눔',sub:'감사를 기록하고 나눠요',tab:'gratitude',icon:'♡'}];\n  return <div><div className="home-brand-row"><div className="home-brand"><img className="home-brand-icon" src="icon-192.png" alt="예수마음 아이콘"/><div><div className="home-brand-title">예수마음</div><div className="home-brand-sub">오늘도 예수님의 마음으로</div></div></div><button className="home-profile-btn" onClick={onOpenMyPage}>♙ 내 정보</button></div><div className="home-redesign">{items.map(item=><button key={item.key} className={item.key} onClick={()=>setTab(item.tab)}><div className="visual"><div className="icon">{item.icon}</div></div><div className="body"><div className="title">{item.title}</div><div className="sub">{item.sub}</div></div><div className="arrow">›</div></button>)}</div><div className="home-verse2"><div className="v">주 예수를 믿으라 그리하면 너와 네 집이 구원을 받으리라 하고</div><div className="r">사도행전 16:31 · 개역개정</div></div></div>\n}'''
          s=s[:a]+home+s[b:]
          s=s.replace('<h2>성경 읽기</h2>','<h2>말씀 체크</h2>',1).replace('오늘 성경 읽기 체크하기','오늘 읽은 말씀 체크하기')
          old='''      <div className="tabs bottom-tabs">\n        {TABS.map(t => (\n          <button key={t.key} className={`tab-btn ${tab === t.key ? 'active' : ''}`} onClick={() => setTab(t.key)}>{t.label}</button>\n        ))}\n      </div>\n\n      {tab === 'home' && <HomeTab member={member} myName={myName} requests={requests} setTab={setTab} today={today} theme={settings.theme} font={settings.font} />}\n      {tab === 'read' && (\n        <>\n          <ReadTab member={member} today={today} toggleReadingDate={toggleReadingDate} />\n          <NoteTab noteData={noteData} today={today} addNote={addNote} deleteNote={deleteNote} />\n        </>\n      )}\n      {tab === 'bank' && <BankTab member={member} addPrayerEntry={addPrayerEntry} deletePrayerEntry={deletePrayerEntry} />}\n      {tab === 'community' && (\n        <>\n          <WallTab requests={requests} loading={wallLoading} myId={myId} myName={myName} isAdmin={adminUnlocked} addRequest={addRequest} prayFor={prayFor} deleteRequest={deleteRequest} />\n          <GratitudeTab entries={gratitudeEntries} loading={gratitudeLoading} myId={myId} myName={myName} isAdmin={adminUnlocked} addEntry={addGratitude} joyFor={joyFor} deleteEntry={deleteGratitude} />\n        </>\n      )}\n      {tab === 'mypage' && (\n        <MyPageTab myName={myName} setMyName={setMyName} member={member} noteData={noteData} settings={settings} onSaveSettings={persistSettings} onOpenAdmin={() => setShowAdminLogin(true)} />\n      )}'''
          new='''      <div className={`tabs bottom-tabs ${tab === 'home' ? 'home-nav-hidden' : ''}`}>\n        {TABS.map(t => <button key={t.key} className={`tab-btn ${tab === t.key ? 'active' : ''}`} onClick={() => setTab(t.key)}>{t.label}</button>)}\n      </div>\n      {tab === 'home' && <HomeTab member={member} myName={myName} requests={requests} setTab={setTab} today={today} theme={settings.theme} font={settings.font} onOpenMyPage={()=>setTab('mypage')} />}\n      {tab === 'read' && <ReadTab member={member} today={today} toggleReadingDate={toggleReadingDate} />}\n      {tab === 'note' && <NoteTab noteData={noteData} today={today} addNote={addNote} deleteNote={deleteNote} />}\n      {tab === 'bank' && <BankTab member={member} addPrayerEntry={addPrayerEntry} deletePrayerEntry={deletePrayerEntry} />}\n      {tab === 'community' && <WallTab requests={requests} loading={wallLoading} myId={myId} myName={myName} isAdmin={adminUnlocked} addRequest={addRequest} prayFor={prayFor} deleteRequest={deleteRequest} />}\n      {tab === 'gratitude' && <GratitudeTab entries={gratitudeEntries} loading={gratitudeLoading} myId={myId} myName={myName} isAdmin={adminUnlocked} addEntry={addGratitude} joyFor={joyFor} deleteEntry={deleteGratitude} />}\n      {tab === 'mypage' && <MyPageTab myName={myName} setMyName={setMyName} member={member} noteData={noteData} settings={settings} onSaveSettings={persistSettings} onOpenAdmin={()=>setShowAdminLogin(true)} />}'''
          if old not in s: raise SystemExit('render block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index_v2.html
          git rm .github/workflows/apply-home-redesign.yml
          git commit -m 'Redesign home menu without changing existing features'
          git push
