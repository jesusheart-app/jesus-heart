name: Apply 예수마음 home redesign
on:
  push:
    paths:
      - '.github/workflows/one-time-home-redesign.yml'
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe home overlay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index_v2.html')
          s=p.read_text(encoding='utf-8')
          if 'jesus-heart-home-redesign-v1' not in s:
              block=r'''<style id="jesus-heart-home-redesign-v1">
          .jh-home{max-width:480px;margin:0 auto;padding:6px 0 28px;font-family:var(--font-body);color:var(--color-text)}
          .jh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 16px}
          .jh-brand{display:flex;align-items:center;gap:10px}.jh-brand img{width:48px;height:48px;border-radius:14px;border:1px solid var(--color-border);box-shadow:0 2px 8px rgba(43,42,40,.08)}
          .jh-title{font-family:var(--font-display);font-size:27px;font-weight:700;color:var(--color-accent);line-height:1.1}.jh-sub{font-size:11px;color:var(--color-muted);margin-top:4px}
          .jh-me{border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-accent);border-radius:12px;padding:8px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font-body)}
          .jh-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.jh-card{min-height:188px;border:1px solid var(--color-border);border-radius:20px;background:var(--color-surface);padding:0;overflow:hidden;text-align:left;cursor:pointer;box-shadow:0 4px 14px rgba(43,42,40,.07);font-family:var(--font-body)}
          .jh-visual{height:92px;position:relative;display:flex;align-items:flex-end;padding:0 14px 10px}.jh-visual:after{content:'';position:absolute;width:120px;height:120px;border-radius:50%;right:-35px;top:-48px;opacity:.24;background:var(--color-sage)}
          .jh-book{background:linear-gradient(135deg,var(--color-sage-soft),#F6F5EF)}.jh-prayer{background:linear-gradient(135deg,var(--color-accent-soft),var(--color-bg))}.jh-note{background:linear-gradient(135deg,var(--color-gold-soft),var(--color-bg))}.jh-grat{background:linear-gradient(135deg,var(--color-sage-soft),var(--color-bg))}
          .jh-svg{position:relative;z-index:1;width:52px;height:52px}.jh-body{padding:12px 14px}.jh-card-title{font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--color-accent)}.jh-book .jh-card-title,.jh-grat .jh-card-title{color:var(--color-sage)}.jh-note .jh-card-title{color:var(--color-gold)}
          .jh-desc{font-size:11px;color:var(--color-muted);margin-top:5px;line-height:1.45}.jh-verse{margin-top:16px;padding:14px 15px;border:1px solid var(--color-border);border-radius:16px;background:rgba(255,255,255,.72);text-align:center}.jh-verse .v{font-family:var(--font-display);font-size:13px;line-height:1.7}.jh-verse .r{font-size:10px;color:var(--color-muted);margin-top:4px}
          .jh-home-hidden{display:none!important}
          </style>
          <script id="jesus-heart-home-redesign-v1">
          (()=>{
            const icon='icon-192.png';
            const svg={book:'<svg class="jh-svg" viewBox="0 0 64 64" fill="none"><rect x="9" y="12" width="22" height="40" rx="4" fill="#fff" stroke="#6B8F71" stroke-width="3"/><rect x="33" y="12" width="22" height="40" rx="4" fill="#fff" stroke="#6B8F71" stroke-width="3"/><path d="M31 16v34M17 23h9M17 31h9M39 23h9M39 31h9" stroke="#6B8F71" stroke-width="3" stroke-linecap="round"/></svg>',prayer:'<svg class="jh-svg" viewBox="0 0 64 64" fill="none"><path d="M20 54c1-13 4-24 10-32 2-3 6-3 7 1l2 11 3-18c1-4 6-4 7 0l-1 22 3-10c1-4 6-3 6 1l-2 18c-1 5-5 8-10 8H20Z" fill="#fff" stroke="#7A2E2E" stroke-width="3" stroke-linejoin="round"/><path d="M28 48c4-5 8-7 13-7 5 0 9 2 13 7" stroke="#7A2E2E" stroke-width="3" stroke-linecap="round"/></svg>',note:'<svg class="jh-svg" viewBox="0 0 64 64" fill="none"><rect x="12" y="9" width="40" height="48" rx="5" fill="#fff" stroke="#B08A3E" stroke-width="3"/><path d="M21 22h22M21 32h22M21 42h14" stroke="#B08A3E" stroke-width="3" stroke-linecap="round"/><path d="M45 8v8" stroke="#B08A3E" stroke-width="4"/></svg>',heart:'<svg class="jh-svg" viewBox="0 0 64 64" fill="none"><path d="M32 52S10 39 10 23c0-7 5-12 12-12 5 0 8 3 10 7 2-4 5-7 10-7 7 0 12 5 12 12 0 16-22 29-22 29Z" fill="#fff" stroke="#6B8F71" stroke-width="3"/><path d="M25 28c2 2 4 3 7 3s5-1 7-3" stroke="#6B8F71" stroke-width="3" stroke-linecap="round"/></svg>'};
            function clickExisting(keys){const bs=[...document.querySelectorAll('button,a')];const b=bs.find(x=>{const t=(x.innerText||x.textContent||'').trim();return keys.some(k=>t.includes(k))});if(b){b.click();return true}return false}
            function mount(){if(document.querySelector('.jh-home'))return;const root=document.querySelector('.app')||document.querySelector('main')||document.body;const h=document.createElement('section');h.className='jh-home';h.innerHTML=`<div class="jh-head"><div class="jh-brand"><img src="${icon}" alt="예수마음"><div><div class="jh-title">예수마음</div><div class="jh-sub">오늘도 예수님의 마음으로</div></div></div><button class="jh-me" type="button">내 정보</button></div><div class="jh-grid"><button class="jh-card jh-book" type="button"><div class="jh-visual">${svg.book}</div><div class="jh-body"><div class="jh-card-title">말씀 체크</div><div class="jh-desc">오늘 읽은 말씀을 체크해요</div></div></button><button class="jh-card jh-prayer" type="button"><div class="jh-visual">${svg.prayer}</div><div class="jh-body"><div class="jh-card-title">기도</div><div class="jh-desc">기도를 기록하고 함께 기도해요</div></div></button><button class="jh-card jh-note" type="button"><div class="jh-visual">${svg.note}</div><div class="jh-body"><div class="jh-card-title">말씀노트</div><div class="jh-desc">말씀을 기록해요</div></div></button><button class="jh-card jh-grat" type="button"><div class="jh-visual">${svg.heart}</div><div class="jh-body"><div class="jh-card-title">감사나눔</div><div class="jh-desc">감사를 기록하고 나눠요</div></div></button></div><div class="jh-verse"><div class="v">이르되 주 예수를 믿으라 그리하면 너와 네 집이 구원을 받으리라 하고</div><div class="r">사도행전 16:31 · 개역개정</div></div>`;const nav=document.querySelector('.tabs');if(nav&&nav.parentElement)nav.parentElement.insertBefore(h,nav);else root.prepend(h);h.querySelector('.jh-me').onclick=()=>{if(!clickExisting(['내 정보','마이페이지'])) alert('내 정보 화면을 준비 중입니다.');};h.querySelector('.jh-book').onclick=()=>{h.remove();clickExisting(['말씀 체크','성경 읽기','말씀']);};h.querySelector('.jh-prayer').onclick=()=>{h.remove();clickExisting(['기도통장','기도']);};h.querySelector('.jh-note').onclick=()=>{h.remove();clickExisting(['말씀노트','말씀 노트','노트']);};h.querySelector('.jh-grat').onclick=()=>{h.remove();clickExisting(['감사나눔','감사 나눔','감사']);};document.querySelectorAll('.tabs').forEach(x=>x.classList.add('jh-home-hidden'));}
            let tries=0;const boot=()=>{if(document.body){mount();tries++;if(tries<30)setTimeout(boot,300)}};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
          })();
          </script>'''
              s=s.replace('</body>',block+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index_v2.html
          git rm .github/workflows/one-time-home-redesign.yml
          git commit -m 'Redesign 예수마음 home screen safely'
          git push
