name: Restore original home screen
on:
  push:
    paths:
      - '.github/workflows/restore-original-home.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pre-redesign index
        run: |
          set -e
          PRE=$(git log --format=%H -- index_v2.html | sed -n '2p')
          test -n "$PRE"
          git checkout "$PRE" -- index_v2.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index_v2.html')
          s=p.read_text(encoding='utf-8')
          # Keep the restored original home exactly as it was; add a tiny safe CSS hint
          # for the prayer card only when its label is present, without replacing the app structure.
          if 'jh-prayer-hand-v1' not in s:
              s=s.replace('</body>', '''<style id="jh-prayer-hand-v1">.prayer-hand-mark{display:inline-flex;align-items:center;justify-content:center;font-size:28px;line-height:1}</style><script id="jh-prayer-hand-v1">(()=>{const run=()=>{document.querySelectorAll('button').forEach(b=>{if((b.textContent||'').includes('기도')&&!b.querySelector('.prayer-hand-mark')){const m=document.createElement('span');m.className='prayer-hand-mark';m.textContent='🙏';m.setAttribute('aria-hidden','true');b.prepend(m)}})};run();new MutationObserver(run).observe(document.body,{childList:true,subtree:true})})();</script></body>''')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index_v2.html
          git rm .github/workflows/restore-original-home.yml
          git commit -m 'Restore original home design and update prayer icon'
          git push
