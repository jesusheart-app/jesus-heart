name: Remove duplicate home overlay
on:
  push:
    paths:
      - '.github/workflows/remove-duplicate-home.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate overlay and set prayer icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index_v2.html')
          s=p.read_text(encoding='utf-8')
          marker='<style id="jesus-heart-home-redesign-v1">'
          if marker in s:
              s=s.split(marker,1)[0].rstrip()+"\n</body>\n</html>\n"
          # Change only the existing HomeTab prayer card icon from ✦ to praying hands.
          old="{key:'word',title:'말씀 체크',sub:'오늘 읽은 말씀을 체크해요',tab:'read',icon:'✓'},{key:'prayer',title:'기도',sub:'기도를 기록하고 함께 기도해요',tab:'bank',icon:'✦'}"
          new="{key:'word',title:'말씀 체크',sub:'오늘 읽은 말씀을 체크해요',tab:'read',icon:'✓'},{key:'prayer',title:'기도',sub:'기도를 기록하고 함께 기도해요',tab:'bank',icon:'🙏'}"
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index_v2.html
          git rm .github/workflows/remove-duplicate-home.yml
          git commit -m 'Remove duplicate home overlay and update prayer icon'
          git push
