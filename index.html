<script>
  // Firebase 설정 (jesus-heart 프로젝트)
  const firebaseConfig = {
    apiKey: "AIzaSyCDlqRtl4O2rVzFXhn5ozpe11e34eRtQKI",
    authDomain: "jesus-heart-2c2b7.firebaseapp.com",
    projectId: "jesus-heart-2c2b7",
    storageBucket: "jesus-heart-2c2b7.firebasestorage.app",
    messagingSenderId: "583535424892",
    appId: "1:583535424892:web:6ec39032a3f2fb5eba20f9"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // 기존 앱 코드가 쓰던 window.storage 인터페이스를 그대로 유지하면서
  // shared=false는 이 기기의 localStorage에, shared=true는 Firestore(appdata 컬렉션)에 저장한다.
  window.storage = {
    async get(key, shared) {
      if (!shared) {
        const v = localStorage.getItem('local:' + key);
        return v !== null ? { key, value: v, shared } : null;
      }
      const snap = await db.collection('appdata').doc(key).get();
      if (!snap.exists) return null;
      return { key, value: snap.data().value, shared };
    },
    async set(key, value, shared) {
      if (!shared) {
        localStorage.setItem('local:' + key, value);
        return { key, value, shared };
      }
      await db.collection('appdata').doc(key).set({ value, updatedAt: Date.now() });
      return { key, value, shared };
    },
  };
</script>

  formal:   { display: "'Batang',Georgia,serif", body: "'Batang',Georgia,serif", label: '전통 명조체' },
};

const DEFAULT_SETTINGS = {

  theme: 'wine',

};

const MORNING_DONE_MESSAGES = [
  '오늘도 하나님과 함께하는 발걸음, 참 아름다워요.',
  '말씀과 함께한 오늘, 은혜가 가득하길 바라요.',

function pickDailyMessage(pool) {
  const dayIndex = Math.floor(Date.now() / 86400000);
  return pool[dayIndex % pool.length];
}

function getDailyGreeting(readToday) {
  const hour = new Date().getHours();
  if (hour >= 18 || hour < 5) return pickDailyMessage(EVENING_MESSAGES);
  return pickDailyMessage(readToday ? MORNING_DONE_MESSAGES : MORNING_PENDING_MESSAGES);
}

function themeStyleVars(themeKey, fontKey) {
  const t = THEMES[themeKey] || THEMES.wine;
  const f = FONTS[fontKey] || FONTS.classic;
  return {
    '--color-bg': t.bg,
    '--color-accent': t.accent,
    '--color-accent-soft': t.accentSoft,
    '--color-gold': t.gold,
    '--color-gold-soft': t.goldSoft,
    '--color-sage': t.sage,
    '--color-sage-soft': t.sageSoft,
    '--font-display': f.display,
    '--font-body': f.body,
  };
}

function pad(n) { return String(n).padStart(2, '0'); }
function todayKey(d = new Date()) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function fmtHeaderDate(d = new Date()) {
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}
function fmtShortDate(dateStr) { const p = dateStr.split('-'); return `${p[1]}.${p[2]}`; }
function fmtWon(n) { return n.toLocaleString('ko-KR') + '원'; }

function computeStreak(readingLog) {
  let streak = 0;
  let cursor = new Date();
  if (!readingLog[todayKey(cursor)]) cursor.setDate(cursor.getDate() - 1);
  while (readingLog[todayKey(cursor)]) { streak += 1; cursor.setDate(cursor.getDate() - 1); }
  return streak;
}

const WALL_REACTIONS = ['🙏', '❤️', '🤗', '💪'];
const GRATITUDE_REACTIONS = ['🙌', '😊', '❤️', '👏'];

function EmojiReactionBar({ reactions, options, onReact }) {
  const r = reactions || {};
  return (
    <div className="reaction-row">
      {options.map(emoji => (
        <button key={emoji} className="reaction-btn" onClick={() => onReact(emoji)}>
          <span>{emoji}</span>
          {r[emoji] ? <span className="reaction-count">{r[emoji]}</span> : null}
        </button>
      ))}
    </div>
  );
}

function MonthGrid({ readingLog }) {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const dows = ['일', '월', '화', '수', '목', '금', '토'];
  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push(<div key={`empty-${i}`} className="day-cell empty"></div>);
  for (let day = 1; day <= daysInMonth; day++) {
    const d = new Date(year, month, day);
    const key = todayKey(d);
    const checked = !!readingLog[key];
    const isToday = key === todayKey(now);
    cells.push(<div key={key} className={`day-cell ${checked ? 'checked' : ''} ${isToday ? 'today' : ''}`}>{day}</div>);
  }
  return (
    <div className="month-grid">
      {dows.map(d => <div key={d} className="month-dow">{d}</div>)}
      {cells}
    </div>
  );
}

function BankTab({ member, addPrayerEntry, deletePrayerEntry }) {
  const [minutesInput, setMinutesInput] = useState('');
  const ledger = member.prayerLedger || [];
  const chronological = [...ledger].sort((a, b) => a.createdAt - b.createdAt);
  let running = 0;
  const withBalance = chronological.map(e => { running += e.amount; return { ...e, balanceAfter: running }; });
  const totalBalance = running;
  const totalMinutes = ledger.reduce((s, e) => s + e.minutes, 0);
  const displayList = [...withBalance].reverse();

  const handleQuickAdd = (m) => addPrayerEntry(m);
  const handleCustomAdd = () => {
    const m = parseInt(minutesInput, 10);
    if (!m || m <= 0) return;
    addPrayerEntry(m);
    setMinutesInput('');
  };

  return (
    <div>
      <div className="passbook-cover">
        <div className="passbook-label">FAITH BANK</div>

        <div className="passbook-balance">{fmtWon(totalBalance)}</div>
        <div className="passbook-sub">누적 기도시간 {totalMinutes}분 · 1분 기도 = {fmtWon(WON_PER_MINUTE)} 적립</div>

          <button className="quick-add-btn" onClick={() => handleQuickAdd(30)}>+30분</button>
        </div>
        <div className="custom-add-row">
          <input type="number" inputMode="numeric" placeholder="직접 입력 (분)" value={minutesInput} onChange={e => setMinutesInput(e.target.value)} />

function App() {
  const [tab, setTab] = useState('read');
  const [identityLoading, setIdentityLoading] = useState(true);
  const [myId, setMyId] = useState(null);
  const [myName, setMyName] = useState('');
  const [member, setMember] = useState(null);
  const [memberLoading, setMemberLoading] = useState(true);
  const [noteData, setNoteData] = useState(null);
  const [noteLoading, setNoteLoading] = useState(true);
  const [requests, setRequests] = useState([]);
  const [wallLoading, setWallLoading] = useState(true);
  const [gratitudeEntries, setGratitudeEntries] = useState([]);
  const [gratitudeLoading, setGratitudeLoading] = useState(true);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [settingsLoading, setSettingsLoading] = useState(true);
  const [showRename, setShowRename] = useState(false);
  const [renameInput, setRenameInput] = useState('');
  const [showAdminLogin, setShowAdminLogin] = useState(false);
  const [adminUnlocked, setAdminUnlocked] = useState(false);
  const today = todayKey();

  const loadMember = useCallback(async (id) => {
    setMemberLoading(true);
    try {
      const r = await window.storage.get(`${MEMBER_PREFIX}${id}`, true);
      if (r && r.value) setMember(JSON.parse(r.value));
      else setMember({ name: '', readingLog: {}, prayerLedger: [] });
    } catch (e) {
      setMember({ name: '', readingLog: {}, prayerLedger: [] });
    } finally {
      setMemberLoading(false);
    }
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const idRes = await window.storage.get('my-id', false);
        const nameRes = await window.storage.get('my-name', false);
        if (idRes && idRes.value && nameRes && nameRes.value) {
          setMyId(idRes.value);
          setMyName(nameRes.value);
          await loadMember(idRes.value);
        } else {
          setMemberLoading(false);
        }
      } catch (e) {
        setMemberLoading(false);
      } finally {
        setIdentityLoading(false);
      }
    })();

    (async () => {
      try {
        const result = await window.storage.get(NOTE_KEY, false);
        if (result && result.value) {
          const parsed = JSON.parse(result.value);
          setNoteData({ notes: parsed.notes || {} });
        } else {
          setNoteData({ notes: {} });
        }
      } catch (e) {
        setNoteData({ notes: {} });
      } finally {
        setNoteLoading(false);
      }
    })();

    (async () => {
      try {
        const result = await window.storage.get(PRAYER_WALL_KEY, true);
        if (result && result.value) setRequests(JSON.parse(result.value));
        else setRequests([]);
      } catch (e) {
        setRequests([]);
      } finally {
        setWallLoading(false);
      }
    })();

    (async () => {
      try {
        const result = await window.storage.get(GRATITUDE_KEY, true);
        if (result && result.value) setGratitudeEntries(JSON.parse(result.value));
        else setGratitudeEntries([]);
      } catch (e) {
        setGratitudeEntries([]);
      } finally {
        setGratitudeLoading(false);
      }
    })();

    (async () => {
      try {
        const result = await window.storage.get(SETTINGS_KEY, true);
        if (result && result.value) setSettings({ ...DEFAULT_SETTINGS, ...JSON.parse(result.value) });
        else setSettings(DEFAULT_SETTINGS);
      } catch (e) {
        setSettings(DEFAULT_SETTINGS);
      } finally {
        setSettingsLoading(false);
      }
    })();
  }, [loadMember]);

  const persistMember = useCallback(async (next) => {
    setMember(next);
    if (!myId) return;
    try { await window.storage.set(`${MEMBER_PREFIX}${myId}`, JSON.stringify(next), true); }
    catch (e) { console.error('저장 실패', e); }
  }, [myId]);

  const persistNoteData = useCallback(async (next) => {
    setNoteData(next);
    try { await window.storage.set(NOTE_KEY, JSON.stringify(next), false); }
    catch (e) { console.error('저장 실패', e); }
  }, []);

  const persistWall = useCallback(async (next) => {
    setRequests(next);
    try { await window.storage.set(PRAYER_WALL_KEY, JSON.stringify(next), true); }
    catch (e) { console.error('저장 실패', e); }
  }, []);

  const persistGratitude = useCallback(async (next) => {
    setGratitudeEntries(next);
    try { await window.storage.set(GRATITUDE_KEY, JSON.stringify(next), true); }
    catch (e) { console.error('저장 실패', e); }
  }, []);

  const persistSettings = useCallback(async (next) => {
    setSettings(next);
    try { await window.storage.set(SETTINGS_KEY, JSON.stringify(next), true); }
    catch (e) { console.error('저장 실패', e); }
  }, []);

  const completeOnboarding = async (nameRaw) => {
    const trimmed = nameRaw.trim();
    if (!trimmed) return;
    const id = `u${Date.now()}${Math.random().toString(36).slice(2, 8)}`;
    try {
      await window.storage.set('my-id', id, false);
      await window.storage.set('my-name', trimmed, false);
    } catch (e) { console.error(e); }
    const newMember = { name: trimmed, readingLog: {}, prayerLedger: [] };
    try { await window.storage.set(`${MEMBER_PREFIX}${id}`, JSON.stringify(newMember), true); } catch (e) { console.error(e); }
    setMyId(id);
    setMyName(trimmed);
    setMember(newMember);
    setMemberLoading(false);
  };

  const renameSelf = async () => {
    const trimmed = renameInput.trim();
    if (!trimmed || !myId) return;
    setMyName(trimmed);
    try { await window.storage.set('my-name', trimmed, false); } catch (e) { console.error(e); }
    const nextMember = { ...member, name: trimmed };
    setMember(nextMember);
    try { await window.storage.set(`${MEMBER_PREFIX}${myId}`, JSON.stringify(nextMember), true); } catch (e) { console.error(e); }
    setShowRename(false);
  };

  const handleAdminSubmit = (pw) => {
    if (pw === settings.adminPasscode) {
      setAdminUnlocked(true);
      setShowAdminLogin(false);
      setTab('admin');
      return true;
    }
    return false;
  };

  if (identityLoading || settingsLoading) return <div className="loading">불러오는 중...</div>;

  const themeVars = themeStyleVars(settings.theme, settings.font);

  if (showAdminLogin) {
    return (
      <div className="app" style={themeVars}>
        <div className="header"><div className="eyebrow">예수마음</div></div>
        <AdminGate onSubmit={handleAdminSubmit} onCancel={() => setShowAdminLogin(false)} />
      </div>
    );
  }

  if (tab === 'admin' && adminUnlocked) {
    return (
      <div className="app" style={themeVars}>
        <div className="header">
          <div className="eyebrow">예수마음</div>
          <h1 style={{ fontSize: 20 }}>관리자 설정</h1>
        </div>
        <AdminPanel settings={settings} onSave={persistSettings} onClose={() => { setAdminUnlocked(false); setTab('read'); }} />
      </div>
    );
  }

  if (!myId) return <NameGate settings={settings} onSubmit={completeOnboarding} />;
  if (memberLoading || !member || noteLoading || !noteData) return <div className="loading">불러오는 중...</div>;

  const streak = computeStreak(member.readingLog || {});
  const readToday = !!member.readingLog[today];
  const dailyMessage = getDailyGreeting(readToday);

  const toggleReading = () => {
    const next = { ...member, readingLog: { ...member.readingLog } };
    if (next.readingLog[today]) delete next.readingLog[today];
    else next.readingLog[today] = true;
    persistMember(next);
  };

  const addPrayerEntry = (minutes) => {
    const entry = { id: `p${Date.now()}`, date: today, minutes, amount: minutes * WON_PER_MINUTE, createdAt: Date.now() };
    persistMember({ ...member, prayerLedger: [...(member.prayerLedger || []), entry] });
  };

  const deletePrayerEntry = (id) => {
    persistMember({ ...member, prayerLedger: (member.prayerLedger || []).filter(e => e.id !== id) });
  };

  const saveNote = (date, text) => {
    const next = { ...noteData, notes: { ...noteData.notes } };
    if (text) next.notes[date] = text; else delete next.notes[date];
    persistNoteData(next);
  };

  const deleteNote = (date) => {
    const next = { ...noteData, notes: { ...noteData.notes } };
    delete next.notes[date];
    persistNoteData(next);
  };

  const addRequest = (name, content) => {
    const item = { id: `r${Date.now()}`, name, content, createdAt: Date.now(), reactions: {} };
    persistWall([...requests, item]);
  };

  const prayFor = (id, emoji) => {
    persistWall(requests.map(r => {
      if (r.id !== id) return r;
      const reactions = { ...(r.reactions || {}) };
      reactions[emoji] = (reactions[emoji] || 0) + 1;
      return { ...r, reactions };
    }));
  };

  const deleteRequest = (id) => persistWall(requests.filter(r => r.id !== id));

  const addGratitude = (name, content) => {
    const item = { id: `g${Date.now()}`, name, content, createdAt: Date.now(), reactions: {} };
    persistGratitude([...gratitudeEntries, item]);
  };

  const joyFor = (id, emoji) => {
    persistGratitude(gratitudeEntries.map(r => {
      if (r.id !== id) return r;
      const reactions = { ...(r.reactions || {}) };
      reactions[emoji] = (reactions[emoji] || 0) + 1;
      return { ...r, reactions };
    }));
  };

  const deleteGratitude = (id) => persistGratitude(gratitudeEntries.filter(r => r.id !== id));

  const TABS = [
    { key: 'read', label: '성경읽기' },
    { key: 'note', label: '말씀노트' },
    { key: 'bank', label: '기도통장' },
    { key: 'wall', label: '기도제목' },
    { key: 'gratitude', label: '감사나눔' },
  ];

  const footnotes = {
    read: '읽기 기록은 성도님들과 공유돼요',
    note: '말씀노트는 이 기기에만, 나만 볼 수 있어요',
    bank: '기도통장은 성도님들과 공유돼요',
    wall: '기도제목함은 모두에게 공유돼요',
    gratitude: '감사나눔도 모두에게 공유돼요',
  };

  return (
    <div className="app" style={themeVars}>
      <div className="header">
        <div className="eyebrow">오늘도 말씀과 기도와 함께</div>
        <h1>예수마음</h1>
        <div className="date">{fmtHeaderDate()}</div>
        <div className="streak-row">
          <FlameIcon />
          <span className="streak-text">연속 <span className="streak-num">{streak}</span>일째 읽는 중</span>
        </div>
        <div className="daily-message">{dailyMessage}</div>
        <div className="identity-row">
          {showRename ? (
            <div className="identity-edit-row">
              <input type="text" value={renameInput} onChange={e => setRenameInput(e.target.value)} placeholder="새 이름" />
              <button onClick={renameSelf}>저장</button>
            </div>
          ) : (
            <>
              {myName}(으)로 참여 중 ·{' '}
              <button className="identity-link" onClick={() => { setRenameInput(myName); setShowRename(true); }}>이름 변경</button>
            </>
          )}
        </div>
      </div>

      <div className="tabs">
        {TABS.map(t => (
          <button key={t.key} className={`tab-btn ${tab === t.key ? 'active' : ''}`} onClick={() => setTab(t.key)}>{t.label}</button>
        ))}
      </div>

      {tab === 'read' && <ReadTab member={member} today={today} toggleReading={toggleReading} />}
      {tab === 'note' && (
        <NoteTab noteData={noteData} today={today} saveNote={saveNote} deleteNote={deleteNote} />
      )}
      {tab === 'bank' && <BankTab member={member} addPrayerEntry={addPrayerEntry} deletePrayerEntry={deletePrayerEntry} />}
      {tab === 'wall' && (
        <WallTab requests={requests} loading={wallLoading} myName={myName} addRequest={addRequest} prayFor={prayFor} deleteRequest={deleteRequest} />
      )}
      {tab === 'gratitude' && (
        <GratitudeTab entries={gratitudeEntries} loading={gratitudeLoading} myName={myName} addEntry={addGratitude} joyFor={joyFor} deleteEntry={deleteGratitude} />
      )}

      <div className="footnote">{footnotes[tab]}</div>
      <div className="admin-entry">
        <button className="admin-entry-link" onClick={() => setShowAdminLogin(true)}>⚙ 관리자</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
