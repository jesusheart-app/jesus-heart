<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7A2E2E">
<title>예수마음</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#FAF6EE;color:#2B2A28;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}.wrap{max-width:430px;margin:auto;padding:48px 20px}.card{background:#fff;border:1px solid #E6DFD1;border-radius:18px;padding:26px;box-shadow:0 2px 8px #00000008}h1{font-family:Georgia,"Batang",serif;color:#7A2E2E;text-align:center;margin:0 0 6px;font-size:28px}p{font-size:13px;line-height:1.6;color:#8C8577;text-align:center;margin:0 0 22px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:16px}.tabs button{border:0;border-radius:10px;padding:10px;background:#F3E4E1;color:#7A2E2E;font-weight:700;cursor:pointer}.tabs button.active{background:#7A2E2E;color:#fff}.field{margin:10px 0}.field label{display:block;font-size:12px;margin-bottom:5px;color:#6d675e}.field input{width:100%;padding:12px;border:1px solid #E6DFD1;border-radius:10px;background:#FAF6EE;font-size:14px}.primary{width:100%;border:0;border-radius:10px;padding:12px;background:#7A2E2E;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}.secondary{width:100%;border:1px solid #E6DFD1;border-radius:10px;padding:11px;background:#fff;color:#7A2E2E;font-weight:700;cursor:pointer;margin-top:8px}.msg{margin-top:12px;padding:10px;border-radius:9px;background:#F6ECD8;font-size:12px;line-height:1.5;display:none}.small{font-size:11px;color:#8C8577;text-align:center;margin-top:14px}.appframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#FAF6EE;display:none}
</style>
</head>
<body>
<div id="gate" class="wrap"><div class="card">
<h1>예수마음</h1><p>우리 교회 공동체를 위한 신앙 앱</p>
<div class="tabs"><button id="loginTab" class="active" onclick="mode('login')">로그인</button><button id="signupTab" onclick="mode('signup')">회원가입</button></div>
<div id="churchField" class="field" style="display:none"><label>교회 가입 암호</label><input id="churchCode" type="password" autocomplete="off" placeholder="교회에서 알려준 암호"></div>
<div id="nameField" class="field" style="display:none"><label>이름</label><input id="name" type="text" autocomplete="name" placeholder="앱에서 사용할 이름"></div>
<div class="field"><label>이메일</label><input id="email" type="email" autocomplete="email" placeholder="이메일 주소"></div>
<div class="field"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password" placeholder="6자 이상"></div>
<button id="submit" class="primary" onclick="submitAuth()">로그인</button><button id="google" class="secondary" onclick="googleLogin()">Google 계정으로 로그인</button><div id="msg" class="msg"></div><div class="small">교회 가입 암호는 교회에서만 안내합니다.</div>
</div></div>
<iframe id="appFrame" class="appframe" src="index_v2.html" title="예수마음 앱"></iframe>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import {getFirestore,doc,setDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyCDlqRtl4O2rVzFXhn5ozpe11e34eRtQKI',authDomain:'jesus-heart-2c2b7.firebaseapp.com',projectId:'jesus-heart-2c2b7',storageBucket:'jesus-heart-2c2b7.firebasestorage.app',messagingSenderId:'583535424892',appId:'1:583535424892:web:6ec39032a3f2fb5eba20f9'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),google=new GoogleAuthProvider();
let currentMode='login';
const codeHash='04df82741e4f5742e0003373bbe314c41a6d98f97ffd04d6d75db77602c74075';
const $=id=>document.getElementById(id);
window.mode=m=>{currentMode=m;$('loginTab').classList.toggle('active',m==='login');$('signupTab').classList.toggle('active',m==='signup');$('churchField').style.display=m==='signup'?'block':'none';$('nameField').style.display=m==='signup'?'block':'none';$('submit').textContent=m==='signup'?'회원가입':'로그인';hideMsg()};
function showMsg(t){$('msg').textContent=t;$('msg').style.display='block'}function hideMsg(){$('msg').style.display='none'}
async function hash(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function enter(){ $('gate').style.display='none';$('appFrame').style.display='block'; }
window.submitAuth=async()=>{hideMsg();const email=$('email').value.trim(),pw=$('password').value,name=$('name').value.trim();try{if(currentMode==='signup'){if(await hash($('churchCode').value.trim())!==codeHash)throw new Error('교회 가입 암호가 맞지 않습니다.');if(!name)throw new Error('이름을 입력해 주세요.');const c=await createUserWithEmailAndPassword(auth,email,pw);await setDoc(doc(db,'appdata','member:'+c.user.uid),{uid:c.user.uid,email:c.user.email,name,createdAt:serverTimestamp()},{merge:true});enter()}else{await signInWithEmailAndPassword(auth,email,pw);enter()}}catch(e){showMsg(e.code==='auth/email-already-in-use'?'이미 가입된 이메일입니다.':e.code==='auth/invalid-credential'?'이메일 또는 비밀번호가 맞지 않습니다.':e.code==='auth/weak-password'?'비밀번호는 6자 이상이어야 합니다.':e.message||'처리 중 오류가 발생했습니다.')}};
window.googleLogin=async()=>{hideMsg();try{const c=await signInWithPopup(auth,google);await setDoc(doc(db,'appdata','member:'+c.user.uid),{uid:c.user.uid,email:c.user.email,name:c.user.displayName||'',updatedAt:serverTimestamp()},{merge:true});enter()}catch(e){showMsg('Google 로그인에 실패했습니다.')}};
onAuthStateChanged(auth,u=>{if(u)enter()});
</script>
</body></html>
